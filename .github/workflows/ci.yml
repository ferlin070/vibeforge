name: MVP checks
on:
  push:
    branches: [main, beta/rc12-hardening]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vibeforgefixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture_only
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
        id: format
      - name: Show session formatting diff on failure
        if: failure() && steps.format.outcome == 'failure'
        run: |
          npx --no-install prettier --write app/cloud.jsx app/page.jsx e2e/integrations.spec.mjs docs/BETA-SESSION-LIFECYCLE.md
          git --no-pager diff -- app/cloud.jsx app/page.jsx e2e/integrations.spec.mjs docs/BETA-SESSION-LIFECYCLE.md
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vibeforgefixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture_only
