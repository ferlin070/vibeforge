name: MVP checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Temporary bootstrap on the audit branch only. Replaced by npm ci after lockfile retrieval.
      - run: npm install --no-audit --no-fund
      - name: Emit generated lockfile for audit commit
        if: github.head_ref == 'audit/rc2-phase1'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const content=fs.readFileSync('package-lock.json','utf8');
          const parts=content.match(/[\s\S]{1,2000}/g);
          console.log('VF_LOCK_META '+JSON.stringify({parts:parts.length,sha256:crypto.createHash('sha256').update(content).digest('hex')}));
          for(let i=0;i<parts.length;i++)console.log('VF_LOCK_PART '+JSON.stringify({i,content:parts[i]}));
          NODE
      - run: npm test
      - run: npm run build
      - run: npm run lint
        continue-on-error: true
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
